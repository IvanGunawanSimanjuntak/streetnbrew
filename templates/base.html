<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Daun & Kopi POS{% endblock %}</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- DaisyUI CDN -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    
    <!-- Google Font (Inter) untuk kesan bersih & modern -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Navbar Global / Header (Opsional, bisa di-override per halaman) -->
    <header class="navbar bg-white shadow-sm border-b border-emerald-100 sticky top-0 z-50 px-4 lg:px-8">
        <div class="flex-1">
            <a href="/" class="text-lg font-bold tracking-wide text-emerald-800 flex items-center gap-2">
                🌱 Street N Brew App
            </a>
        </div>
        <div class="flex-none gap-3">
            <a href="/" class="btn btn-sm btn-ghost text-emerald-700 hover:bg-emerald-50">E-Menu Pelanggan</a>
            <a href="/kasir/pos" class="btn btn-sm bg-emerald-700 hover:bg-emerald-800 text-white border-none">Kasir (POS)</a>
            <a href="/kasir/reports" class="btn btn-sm btn-outline border-emerald-600 text-emerald-700 hover:bg-emerald-50">Laporan & Stok</a>
        </div>
    </header>

    <!-- Area Konten Dinamis -->
    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer Sederhana -->
    <footer class="footer footer-center p-4 bg-white text-slate-500 border-t border-emerald-100 text-xs">
        <div>
            <p>Copyright © 2026 - Street N Brew System</p>
        </div>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
