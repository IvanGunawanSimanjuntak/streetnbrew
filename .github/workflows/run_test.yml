name: Street N Brew Automated Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest requests playwright
        playwright install --with-deps

    # Menjalankan Flask dengan mode testing / SQLite sementara agar tidak butuh PostgreSQL eksternal
    - name: Start Flask Server
      run: |
        # Jika aplikasimu membaca environment variable untuk database, atur di sini.
        # Atau jalankan Flask di latar belakang:
        python app.py &
        # Beri waktu jeda 5 detik agar server benar-benar siap
        sleep 5

    - name: Run API Tests
      run: |
        pytest test_api.py -v